# Tail Lights as an app for an Android phone: the example's own code, in the library an
# activity loads. Built into a package by `cargo apk` (see docs/ANDROID.md).
[package]
name = "tail_lights_android"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]
path = "lib.rs"

[target.'cfg(target_os = "android")'.dependencies]
mira = { path = "../.." }
anyhow = "1"
log = "0.4"
# What is logged goes where a phone keeps it, to be read with `adb logcat`.
android_logger = "0.14"

[package.metadata.android]
package = "dev.mira.taillights"
build_targets = ["aarch64-linux-android"]
apk_name = "tail-lights"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "Tail Lights"

[package.metadata.android.application.activity]
orientation = "landscape"
config_changes = "orientation|screenSize|screenLayout|keyboardHidden"