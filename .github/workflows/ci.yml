name: CI

# The full suite. It runs on every pull request, on what the merge queue is about to put on
# master, on master itself, and (called from release.yml) before a release is built.
on:
  pull_request:
  merge_group:
  push:
    branches: [master]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The Haskell plugin tests must run here, not skip.
  MIRA_REQUIRE_GHC: 1
  # The MeadowBoot the Meadow scripts are built with (see the jobs).
  MEADOWBOOT_RELEASE: v0.4.0

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - name: Rust
      run: rustup update stable && rustup default stable && rustup component add clippy
    # Sound goes out through ALSA on Linux, and game controllers are found through udev:
    # the build needs the headers of both.
    - name: Linux headers
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
    - uses: Swatinem/rust-cache@v2
    # The runner's Command Line Tools have a linker that cannot read their own SDK (macOS 27's
    # lists an architecture it does not know), so GHC cannot link a plugin with them. Xcode's
    # tools are a matched set: everything here is built with the newest Xcode instead.
    - name: Xcode
      if: runner.os == 'macOS'
      run: |
        xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
        echo "Building with $xcode"
        echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
        sdk="$xcode/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk"
        echo "SDKROOT=$sdk" >> "$GITHUB_ENV"
        # GHC's own packages name the Command Line Tools' SDK by its path, whatever the above
        # say: that path is made Xcode's SDK too.
        ls -l /Library/Developer/CommandLineTools/SDKs/
        sudo ln -sfn "$sdk" /Library/Developer/CommandLineTools/SDKs/MacOSX.sdk
    # Haskell is mira's other scripting language; its bindings are tested by building and
    # hot-reloading real plugins.
    - uses: haskell-actions/setup@v2
      with:
        ghc-version: '9.12.2'
        enable-stack: false
    - name: GHC's C toolchain
      if: runner.os == 'macOS'
      run: ghc --info | grep -iE 'sysroot|C compiler|ld command|linker' || true
    # check.sh lints the Haskell when hlint is there. One platform is enough for a linter.
    - uses: haskell-actions/hlint-setup@v2
      if: runner.os == 'Linux'
      with:
        version: '3.10'
    # Meadow is mira's scripting language. Its scripts are built with MeadowBoot, from
    # Meadow's release (the archive for this runner's system), and their tests must run
    # here, not skip.
    - name: MeadowBoot
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        case "$(uname -s)-$(uname -m)" in
          Linux-x86_64) target=x86_64-unknown-linux-gnu ;;
          Linux-aarch64) target=aarch64-unknown-linux-gnu ;;
          Darwin-arm64) target=aarch64-apple-darwin ;;
          Darwin-x86_64) target=x86_64-apple-darwin ;;
          *) echo "no MeadowBoot for $(uname -s)-$(uname -m)"; exit 1 ;;
        esac
        gh release download "$MEADOWBOOT_RELEASE" -R meadow-lang/meadow -p "meadowboot-$target.tar.gz" -D "$RUNNER_TEMP/meadowboot"
        tar -xzf "$RUNNER_TEMP"/meadowboot/*.tar.gz -C "$RUNNER_TEMP/meadowboot"
        echo "MIRA_MEADOWBOOT=$(find "$RUNNER_TEMP/meadowboot" -name MeadowBoot -type f | head -n 1)" >> "$GITHUB_ENV"
        echo "MIRA_REQUIRE_MEADOWBOOT=1" >> "$GITHUB_ENV"
    - name: Full suite
      run: scripts/check.sh

  windows:
    # Windows is built, tested and linted on every change, as Linux and macOS are. The
    # plugin tests compile C with clang here, which the runner has, and build Haskell
    # plugins with the same script as elsewhere, run by Git's `sh`.
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Rust
      run: rustup update stable && rustup default stable && rustup component add clippy
    - uses: Swatinem/rust-cache@v2
    - uses: haskell-actions/setup@v2
      with:
        ghc-version: '9.12.2'
        enable-stack: false
    - name: MeadowBoot
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $into = Join-Path $env:RUNNER_TEMP meadowboot
        gh release download $env:MEADOWBOOT_RELEASE -R meadow-lang/meadow -p 'meadowboot-x86_64-pc-windows-msvc.zip' -D $into
        if ($LASTEXITCODE -ne 0) { exit 1 }
        Expand-Archive (Get-ChildItem $into -Filter *.zip).FullName -DestinationPath $into
        $boot = (Get-ChildItem $into -Recurse -Filter MeadowBoot.exe | Select-Object -First 1).FullName
        "MIRA_MEADOWBOOT=$boot" >> $env:GITHUB_ENV
        "MIRA_REQUIRE_MEADOWBOOT=1" >> $env:GITHUB_ENV
    - name: Build
      run: cargo build --workspace --all-targets
    - name: Test
      run: cargo test --workspace
    - name: Clippy
      run: cargo clippy --workspace --all-targets -- -D warnings

  android:
    # The engine is built for Android on every change, so that nothing is written that a
    # phone cannot have. It is not run there: that needs a device, or one pretended.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Rust
      run: rustup update stable && rustup default stable && rustup target add aarch64-linux-android && rustup component add clippy
    - uses: Swatinem/rust-cache@v2
    # What is written in C among what the engine depends on is compiled with the kit the
    # runner has for Android.
    - name: Clippy for Android
      run: |
        tools="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
        export CC_aarch64_linux_android="$tools/aarch64-linux-android24-clang"
        export CXX_aarch64_linux_android="$tools/aarch64-linux-android24-clang++"
        export AR_aarch64_linux_android="$tools/llvm-ar"
        cargo clippy -p mira --lib --target aarch64-linux-android -- -D warnings

  miri:
    # The ECS hands out references from behind `UnsafeCell` and stores some components as
    # raw bytes; Miri checks that code for undefined behaviour.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Miri
      run: rustup toolchain install nightly --component miri
    - uses: Swatinem/rust-cache@v2
    - name: Miri
      run: scripts/check.sh --miri-only

  tsan:
    # Systems run side by side and share out their queries' work between threads;
    # ThreadSanitizer watches the ECS's tests for two threads at the same memory.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install nightly with its source
      run: rustup toolchain install nightly --component rust-src
    - uses: Swatinem/rust-cache@v2
    - name: ThreadSanitizer
      run: scripts/check.sh --tsan-only
