name: Android package

# Builds Tail Lights, and RetroDunk (a Meadow script), into packages for an Android phone,
# to be put on one and tried. Run by hand, or when what they are built from changes in a
# pull request.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'examples/tail_lights/**'
      - 'examples/retro_dunk/**'
      - 'bindings/meadow/**'
      - 'scripts/meadow-for.sh'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v4
    - name: Rust
      run: rustup update stable && rustup default stable && rustup target add aarch64-linux-android x86_64-linux-android
    - uses: Swatinem/rust-cache@v2
    - name: cargo-apk
      run: cargo install cargo-apk --locked
    # A package signed with a key for trying things, as a debug build is, but with the
    # code made fast, since a phone would crawl through the engine otherwise.
    - name: Package
      env:
        CARGO_PROFILE_DEV_OPT_LEVEL: 3
        CARGO_PROFILE_DEV_DEBUG: 0
        # Without the names of things, which a phone has no use for: half the size.
        CARGO_PROFILE_DEV_STRIP: symbols
      run: |
        export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
        # For a phone, and then for the pretended phone below, whose processor is another:
        # each in a package of its own, so that the one for a phone carries only its own.
        cargo apk build -p tail_lights_android --target aarch64-linux-android
        mkdir -p packages
        cp target/debug/apk/tail-lights.apk packages/tail-lights.apk
        cargo apk build -p tail_lights_android --target x86_64-linux-android
        cp target/debug/apk/tail-lights.apk packages/tail-lights-emulator.apk
        ls -l packages
        unzip -l packages/tail-lights.apk
    - uses: actions/upload-artifact@v4
      with:
        name: tail-lights-apk
        path: packages/tail-lights.apk
        if-no-files-found: error
    # Tried on a pretended phone: the game is started, left a while, and what it logged and
    # what was on the screen are kept, whether it lived or not. This tells whether the
    # package can be loaded and begun; it draws on the processor, far slower than a phone.
    - name: Let the emulator use the processor directly
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Try it on an emulator
      timeout-minutes: 12
      continue-on-error: true
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        arch: x86_64
        target: google_apis
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
        disable-animations: true
        script: sh android/try-on-emulator.sh packages/tail-lights-emulator.apk dev.mira.taillights
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: tried-on-an-emulator
        path: |
          tried-screen.png
          tried-log.txt
          tried-alive.txt
        if-no-files-found: warn

  # RetroDunk is a Meadow script: MeadowBoot (from Meadow's release, which carries the
  # phones' runtimes) builds it ahead of time into a library for each kind of processor,
  # and the package carries it beside the engine.
  retro-dunk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MEADOWBOOT_RELEASE: v0.4.0
    steps:
    - uses: actions/checkout@v4
    - name: Rust
      run: rustup update stable && rustup default stable && rustup target add aarch64-linux-android x86_64-linux-android
    - uses: Swatinem/rust-cache@v2
    - name: cargo-apk
      run: cargo install cargo-apk --locked
    - name: MeadowBoot
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release download "$MEADOWBOOT_RELEASE" -R meadow-lang/meadow -p 'meadowboot-x86_64-unknown-linux-gnu.tar.gz' -D "$RUNNER_TEMP/meadowboot"
        tar -xzf "$RUNNER_TEMP"/meadowboot/*.tar.gz -C "$RUNNER_TEMP/meadowboot"
        echo "MIRA_MEADOWBOOT=$(find "$RUNNER_TEMP/meadowboot" -name MeadowBoot -type f | head -n 1)" >> "$GITHUB_ENV"
    - name: The game, for a phone and for the emulator
      run: |
        export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
        sh scripts/meadow-for.sh examples/retro_dunk/Dunk.mw aarch64-linux-android android/retro_dunk/libs/arm64-v8a
        sh scripts/meadow-for.sh examples/retro_dunk/Dunk.mw x86_64-linux-android android/retro_dunk/libs/x86_64
        # Without the names of things, which a phone has no use for; what it exports stays.
        strip="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
        "$strip" --strip-unneeded android/retro_dunk/libs/arm64-v8a/libDunk.so android/retro_dunk/libs/x86_64/libDunk.so
        ls -l android/retro_dunk/libs/*
    - name: Package
      env:
        CARGO_PROFILE_DEV_OPT_LEVEL: 3
        CARGO_PROFILE_DEV_DEBUG: 0
        CARGO_PROFILE_DEV_STRIP: symbols
      run: |
        export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
        mkdir -p packages
        cargo apk build -p retro_dunk_android --target aarch64-linux-android
        cp target/debug/apk/retro-dunk.apk packages/retro-dunk.apk
        cargo apk build -p retro_dunk_android --target x86_64-linux-android
        cp target/debug/apk/retro-dunk.apk packages/retro-dunk-emulator.apk
        ls -l packages
        unzip -l packages/retro-dunk.apk | grep -E 'lib/|classes' || true
    - uses: actions/upload-artifact@v4
      with:
        name: retro-dunk-apk
        path: packages/retro-dunk.apk
        if-no-files-found: error
    - name: Let the emulator use the processor directly
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Try it on an emulator
      timeout-minutes: 12
      continue-on-error: true
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        arch: x86_64
        target: google_apis
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
        disable-animations: true
        script: sh android/try-on-emulator.sh packages/retro-dunk-emulator.apk dev.mira.retrodunk
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: retro-dunk-on-an-emulator
        path: |
          tried-screen.png
          tried-log.txt
          tried-alive.txt
        if-no-files-found: warn