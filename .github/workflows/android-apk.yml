name: Android package

# Builds Tail Lights into a package for an Android phone, to be put on one and tried. Run by
# hand, or when what it is built from changes in a pull request.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v4
    - name: Rust
      run: rustup update stable && rustup default stable && rustup target add aarch64-linux-android x86_64-linux-android
    - uses: Swatinem/rust-cache@v2
    - name: cargo-apk
      run: cargo install cargo-apk --locked
    # A package signed with a key for trying things, as a debug build is, but with the
    # code made fast, since a phone would crawl through the engine otherwise.
    - name: Package
      env:
        CARGO_PROFILE_DEV_OPT_LEVEL: 3
        CARGO_PROFILE_DEV_DEBUG: 0
      run: |
        export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
        cargo apk build -p tail_lights_android
        ls -l target/debug/apk/
        unzip -l target/debug/apk/tail-lights.apk
    - uses: actions/upload-artifact@v4
      with:
        name: tail-lights-apk
        # The one to put on a phone; the other beside it is the same before it was aligned.
        path: target/debug/apk/tail-lights.apk
        if-no-files-found: error
    # Tried on a pretended phone: the game is started, left a while, and what it logged and
    # what was on the screen are kept, whether it lived or not. This tells whether the
    # package can be loaded and begun; it draws on the processor, far slower than a phone.
    - name: Let the emulator use the processor directly
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Try it on an emulator
      timeout-minutes: 12
      continue-on-error: true
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        arch: x86_64
        target: google_apis
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
        disable-animations: true
        script: sh android/try-on-emulator.sh target/debug/apk/tail-lights.apk dev.mira.taillights
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: tried-on-an-emulator
        path: |
          tried-screen.png
          tried-log.txt
          tried-alive.txt
        if-no-files-found: warn