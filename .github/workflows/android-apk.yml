name: Android package

# Builds Tail Lights into a package for an Android phone, to be put on one and tried. Run by
# hand, or when what it is built from changes in a pull request.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Rust
      run: rustup update stable && rustup default stable && rustup target add aarch64-linux-android
    - uses: Swatinem/rust-cache@v2
    - name: cargo-apk
      run: cargo install cargo-apk --locked
    # A package signed with a key for trying things, as a debug build is, but with the
    # code made fast, since a phone would crawl through the engine otherwise.
    - name: Package
      env:
        CARGO_PROFILE_DEV_OPT_LEVEL: 3
        CARGO_PROFILE_DEV_DEBUG: 0
      run: |
        export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
        cargo apk build -p tail_lights_android
        find target -name '*.apk' -exec ls -l {} \;
    - uses: actions/upload-artifact@v4
      with:
        name: tail-lights-apk
        path: target/debug/apk/*.apk
        if-no-files-found: error